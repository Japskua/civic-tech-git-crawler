github:
  max_retries: 5
  retry_delay: 3
  rate_limit_buffer: 100

# Canonical civic-tech corpus — 2026-05 refresh (n = 57).
# Authoritative roster of open-source civic-tech projects spanning North America
# (Code for America, CivicTechWR / Canada), Africa (Code for Africa), Japan
# (Code for Japan), Taiwan (g0v), and a large German "Code for"/OK-Lab cluster
# (Bielefeld, Münster, Berlin, Flensburg, Cologne, Leipzig, Magdeburg,
# OpenLegalData), plus participation/deliberation tools (Decidim, VoteIT,
# DigiDemLab). See datasets/2026_05/README.md for the manifest and rationale.
#
# Note: 3 entries are forks (CivicTechWR/connectedkw,
# CodeforLeipzig/weihnachtsmarktkarte, CodeforLeipzig/leipziggiesst) — their
# contributor/commit metrics inherit upstream history; see dataset caveats.
repositories:
  # Canada — Toronto / Waterloo Region civic tech
  - "bikespace/bikespace"
  - "choruslabs/chorus"
  - "civic-dashboard/civic-dashboard-web"
  - "CivicTechWR/accessible-housing-portal"
  - "CivicTechWR/connectedkw"                   # fork
  - "CivicTechWR/go-train-group-pass"
  - "CivicTechWR/project-pech"
  - "CivicTechWR/WRVotesPlaceholder"
  # USA — Code for America / CiviForm
  - "civiform/civiform"
  - "codeforamerica/asap_pdf"
  - "codeforamerica/cmr-maryland-eligibility-determination"
  - "codeforamerica/document-transfer-service"
  - "codeforamerica/efiler-api"
  - "codeforamerica/form-flow"
  - "codeforamerica/pya"
  - "codeforamerica/tax-benefits-backend"
  - "codeforamerica/vita-min"
  # Africa — Code for Africa
  - "CodeForAfrica/academy.AFRICA"
  - "CodeForAfrica/actNOW"
  - "CodeForAfrica/Dominion.AFRICA"
  - "CodeForAfrica/GenderGap.AFRICA"
  - "CodeForAfrica/openAFRICA"
  - "CodeForAfrica/outbreak.AFRICA"
  - "CodeForAfrica/PromiseTracker"
  - "CodeForAfrica/sensors.AFRICA"
  - "CodeForAfrica/ui"
  # Japan — Code for Japan
  - "codeforjapan/BirdXplorer"
  - "codeforjapan/decidim-cfj"
  # Taiwan — g0v
  - "g0v/tw-rental-house-data"
  # Germany — Code for / OK Lab network
  - "codeforbielefeld/baumbie"
  - "codeforbielefeld/losdb"
  - "codeformuenster/klimawatch"
  - "codeforberlin/we-count"
  - "openlegaldata/oldp"
  - "oklabflensburg/open-emergency-map"
  - "oklabflensburg/oddfl"
  - "oklabflensburg/open-parcel-map"
  - "oklabflensburg/open-biotope-map"
  - "oklabflensburg/open-school-map"
  - "oklabflensburg/open-data-api"
  - "oklabflensburg/open-recycling-map"
  - "oklabflensburg/open-trees-map"
  - "oklabflensburg/open-monuments-map"
  - "codeforcologne/Denkmal-4D-Koeln"
  - "CodeforLeipzig/weihnachtsmarktkarte"        # fork
  - "CodeforLeipzig/leipziggiesst"               # fork
  - "code-for-magdeburg/StadtratWatch-web"
  # Participation / deliberation platforms
  - "VoteIT/voteit_frontend"
  - "digidemlab/decidim-census"
  # Networked / decentralised civic infrastructure
  - "meshtastic/firmware"
  - "meshtastic/Meshtastic-Android"
  - "meshtastic/web"
  - "iiab/iiab"
  # Transparency / scoring / other
  - "mysociety/ceuk-marking"
  - "ton-An/station_reach"

output:
  directory: "./datasets/2026_05"

detection:
  cloud_keywords:
    topics:
      - aws
      - gcp
      - azure
      - cloud
      - serverless
      - kubernetes
      - docker
    languages:
      - HCL
      - Dockerfile
    files:
      - Dockerfile
      - docker-compose.yml
      - docker-compose.yaml
      - cdk.json
      - serverless.yml
      - terraform.tf
      - cloudbuild.yaml
      - appspec.yml
      - Procfile
      - .buildpacks
    dependencies:
      - boto3
      - google-cloud
      - azure
      - aws-cdk
      - pulumi

  ai_ml_keywords:
    topics:
      - machine-learning
      - deep-learning
      - ai
      - nlp
      - computer-vision
      - artificial-intelligence
    languages:
      - Jupyter Notebook
    files:
      - "*.ipynb"
    # Traditional/classical ML only — LLM SDKs live under product_llm_keywords.
    dependencies:
      - tensorflow
      - pytorch
      - torch
      - scikit-learn
      - transformers
      - keras
      - xgboost
      - lightgbm
      - huggingface
      - spacy
      - nltk

  # --- AI-usage detection (kept separate from traditional ML above) ---------
  # Group 3: LLM coding tools used to *build* the project. Maps each marker to a
  # tool label. Omit a block to fall back to the code defaults in
  # utils/ai_detection.py (DEFAULT_AI_DEV_KEYWORDS).
  ai_dev_keywords:
    config_files:
      CLAUDE.md: claude_code
      AGENTS.md: agents_md
      .cursorrules: cursor
      .windsurfrules: windsurf
      .aider.conf.yml: aider
      GEMINI.md: gemini_cli
      .clinerules: cline
      .roomodes: roo
      .mcp.json: mcp
      soul.md: soul_md
      SOUL.md: soul_md
    config_paths:
      .github/copilot-instructions.md: github_copilot
      .cursor/mcp.json: cursor
    config_dirs:
      .claude: claude_code
      .cursor/rules: cursor
      .github/prompts: github_copilot
      .github/chatmodes: github_copilot
      .continue: continue
      .roo: roo
      .junie: junie
    trailer_tools:
      claude: claude_code
      copilot: github_copilot
      cursor: cursor
      devin: devin
      codex: openai_codex
      aider: aider
      jules: jules
      clawcode: clawcode
      openhuman: openhuman
      "hermes agent": hermes_agent
    agent_bot_logins:
      copilot-swe-agent[bot]: github_copilot
      copilot[bot]: github_copilot
      devin-ai-integration[bot]: devin
      cursoragent: cursor
      cursor[bot]: cursor
      google-labs-jules[bot]: jules
      jules[bot]: jules
      sweep-ai[bot]: sweep
      claude[bot]: claude_code
      claude-bot: claude_code
    agent_bot_emails:
      noreply@anthropic.com: claude_code
    review_bot_logins:
      coderabbitai[bot]: coderabbit
      sourcery-ai[bot]: sourcery
      sweep-ai[bot]: sweep
      github-advanced-security[bot]: github_security
      copilot-pull-request-reviewer[bot]: github_copilot
    workflow_refs:
      anthropics/claude-code-action: claude_code
      claude-code-action: claude_code
      coderabbit: coderabbit
      github/copilot: github_copilot
      cursor: cursor
      sweep: sweep
      aider: aider
    dependencies:
      aider-chat: aider
      claude-code: claude_code
      "@anthropic-ai/claude-code": claude_code
      "@openai/codex": openai_codex

  # Group 2: LLM shipped as a product artifact. Dependency -> provider label.
  product_llm_keywords:
    dependencies:
      openai: openai
      anthropic: anthropic
      "@anthropic-ai/sdk": anthropic
      google-generativeai: google
      google-genai: google
      "@google/generative-ai": google
      cohere: cohere
      mistralai: mistral
      litellm: multi_provider
      langchain: langchain
      langgraph: langchain
      llama-index: llamaindex
      llama_index: llamaindex
      llamaindex: llamaindex
      ollama: ollama
      groq: groq
      replicate: replicate
      guidance: guidance
      instructor: instructor
      semantic-kernel: semantic_kernel
      haystack-ai: haystack
      vllm: vllm
      openrouter: openrouter
      deepseek: deepseek
      dashscope: qwen
      qwen: qwen
      moonshot: moonshot
      kimi: moonshot
      zhipuai: zhipu
      openllm: openllm
      mlx-lm: mlx
      mlx: mlx
      llama-cpp-python: llama_cpp
      ctransformers: ctransformers
      # onnxruntime-genai is the LLM-specific ONNX runtime; bare "onnx" is
      # intentionally omitted (non-LLM CV/ML projects ship ONNX → false positives).
      onnxruntime-genai: onnx_genai
    topics:
      - llm
      - gpt
      - chatgpt
      - rag
      - chatbot
      - generative-ai
      - openai
      - large-language-models
      - openrouter
      - deepseek
      - qwen
      - kimi
      - moonshot
      - llama
      - mistral
      - gemini
      - ollama
      - mlx
      - local-llm
