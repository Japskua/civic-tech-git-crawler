name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: Lint and test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install project and dev dependencies
        run: uv sync

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Run pytest
        run: uv run pytest -v

  docker:
    name: Build Docker image and smoke-test the CLI
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: civic-tech-crawler:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test CLI (--help) inside the image
        run: docker run --rm civic-tech-crawler:ci --help

      - name: Smoke-test the resumable wrapper is present and executable
        run: docker run --rm --entrypoint test civic-tech-crawler:ci -x /app/scripts/run_with_respawn.sh
