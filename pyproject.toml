[project]
name = "civic-tech-crawler"
version = "0.1.0"
description = "GitHub repository metrics crawler for civic-tech research (CHAOSS metrics, weekly activity, contributor concentration)"
readme = "README.md"
license = { file = "LICENSE.txt" }
authors = [
    { name = "Janne Parkkila", email = "japskua@gmail.com" }
]
requires-python = ">=3.13"
keywords = [
    "civic-technology",
    "software-engineering",
    "mining-software-repositories",
    "CHAOSS",
    "open-source-sustainability",
    "github-api",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "PyGithub>=2.5.0",
    "httpx>=0.28.0",
    "matplotlib>=3.8",
    "networkx>=3.0",
    "numpy>=1.26",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "scipy>=1.12",
]

[project.urls]
Repository    = "https://github.com/Japskua/civic-tech-git-crawler"
Issues        = "https://github.com/Japskua/civic-tech-git-crawler/issues"
Documentation = "https://github.com/Japskua/civic-tech-git-crawler#readme"
# Dataset DOI is filled in after the Zenodo deposit (see CHANGELOG / CITATION.cff).
Dataset       = "https://github.com/Japskua/civic-tech-git-crawler/tree/master/datasets/2026_05"

[project.scripts]
civic-tech-crawler = "civic_tech_crawler.cli:main"

[build-system]
requires = ["uv_build>=0.9.10,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "responses>=0.25",
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]
