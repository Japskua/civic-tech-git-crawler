[project]
name = "civic-tech-crawler"
version = "0.1.0"
description = "GitHub repository metrics crawler for civic tech research"
readme = "README.md"
authors = [
    { name = "Janne Parkkila", email = "japskua@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "PyGithub>=2.5.0",
    "httpx>=0.28.0",
    "networkx>=3.0",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.scripts]
civic-tech-crawler = "civic_tech_crawler.cli:main"

[build-system]
requires = ["uv_build>=0.9.10,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "responses>=0.25",
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]
